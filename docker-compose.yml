version: '3.8'

services:
  interview-coach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-coach
    stdin_open: true
    tty: true
    environment:
      # OpenRouter (recommended)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
    volumes:
      # Mount logs directory to persist interview transcripts
      - ./logs:/app/logs

      # Uncomment to mount a script file for scripted mode
      # - ./example_script.txt:/app/script.txt

    # Default: interactive mode
    # For scripted mode, uncomment the line below
    # command: ["script.txt"]
